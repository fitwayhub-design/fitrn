name: Build mobile apps

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL of the project zip to build"
        required: true
        type: string

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Download project zip
        run: curl -L --fail --retry 3 -o project.zip "${{ inputs.zip_url }}"

      - name: Unzip project
        shell: bash
        run: |
          mkdir -p project
          unzip -q project.zip -d project
          entries=( project/* )
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv project project_outer
            mv "${entries[0]}" project
            rm -rf project_outer
          fi
          if [ ! -f project/package.json ]; then
            echo "::error::package.json not found at project root after unzip"
            ls -la project
            exit 1
          fi

      - name: Detect project type
        id: detect
        shell: bash
        working-directory: project
        run: |
          if ls capacitor.config.* >/dev/null 2>&1; then
            echo "type=capacitor" >> "$GITHUB_OUTPUT"
          elif [ -d android ]; then
            echo "type=native" >> "$GITHUB_OUTPUT"
          elif [ -f app.json ] || [ -f app.config.js ] || [ -f app.config.ts ]; then
            echo "type=expo" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No android/ directory, no Capacitor config, and no Expo config. Cannot build."
            ls -la
            exit 1
          fi
          echo "Detected project type: $(cat "$GITHUB_OUTPUT" | grep ^type=)"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install npm dependencies
        shell: bash
        working-directory: project
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build web assets (Capacitor)
        if: steps.detect.outputs.type == 'capacitor'
        shell: bash
        working-directory: project
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script in package.json — skipping web build."
          fi

      - name: Capacitor sync (Android)
        if: steps.detect.outputs.type == 'capacitor'
        shell: bash
        working-directory: project
        run: npx cap sync android

      - name: Expo prebuild (Android)
        if: steps.detect.outputs.type == 'expo'
        working-directory: project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build APK
        shell: bash
        working-directory: project/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: project/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Download project zip
        run: curl -L --fail --retry 3 -o project.zip "${{ inputs.zip_url }}"

      - name: Unzip project
        shell: bash
        run: |
          mkdir -p project
          unzip -q project.zip -d project
          entries=( project/* )
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv project project_outer
            mv "${entries[0]}" project
            rm -rf project_outer
          fi
          if [ ! -f project/package.json ]; then
            echo "::error::package.json not found at project root after unzip"
            ls -la project
            exit 1
          fi

      - name: Detect project type
        id: detect
        shell: bash
        working-directory: project
        run: |
          if ls capacitor.config.* >/dev/null 2>&1; then
            echo "type=capacitor" >> "$GITHUB_OUTPUT"
          elif [ -d ios ]; then
            echo "type=native" >> "$GITHUB_OUTPUT"
          elif [ -f app.json ] || [ -f app.config.js ] || [ -f app.config.ts ]; then
            echo "type=expo" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No ios/ directory, no Capacitor config, and no Expo config. Cannot build."
            ls -la
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install npm dependencies
        shell: bash
        working-directory: project
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build web assets (Capacitor)
        if: steps.detect.outputs.type == 'capacitor'
        shell: bash
        working-directory: project
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script in package.json — skipping web build."
          fi

      - name: Capacitor sync (iOS)
        if: steps.detect.outputs.type == 'capacitor'
        shell: bash
        working-directory: project
        run: npx cap sync ios

      - name: Expo prebuild (iOS)
        if: steps.detect.outputs.type == 'expo'
        working-directory: project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Locate iOS project dir
        id: iosdir
        shell: bash
        working-directory: project
        run: |
          if [ -f ios/App/Podfile ]; then
            echo "dir=ios/App" >> "$GITHUB_OUTPUT"
          elif [ -f ios/Podfile ]; then
            echo "dir=ios" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not find a Podfile under ios/ or ios/App/"
            ls -la ios || true
            exit 1
          fi

      - name: Install CocoaPods
        shell: bash
        working-directory: project/${{ steps.iosdir.outputs.dir }}
        run: pod install --repo-update

      - name: Build archive
        shell: bash
        working-directory: project/${{ steps.iosdir.outputs.dir }}
        run: |
          WORKSPACE=$(ls *.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        shell: bash
        working-directory: project/${{ steps.iosdir.outputs.dir }}
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/App.xcarchive/Products/Applications/*.app build/ipa/Payload/
          cd build/ipa && zip -qr ../App.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: project/${{ steps.iosdir.outputs.dir }}/build/App.ipa
          if-no-files-found: error
