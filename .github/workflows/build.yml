name: Build mobile apps

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL of the project zip to build"
        required: true
        type: string

# iOS signing (optional). The job auto-detects whether the following six
# secrets are configured on the fitrn repo and chooses its path accordingly:
#
#   IOS_P12_BASE64        base64 of your iOS Distribution .p12
#   IOS_P12_PASSWORD      password for the .p12
#   APPSTORE_ISSUER_ID    App Store Connect API issuer ID (UUID)
#   APPSTORE_KEY_ID       App Store Connect API key ID
#   APPSTORE_PRIVATE_KEY  full contents of the .p8 key file
#   APPSTORE_TEAM_ID      your 10-character Apple Team ID
#
# Optional but recommended:
#   APPSTORE_BUNDLE_ID    bundle id for provisioning profile download
#                         (defaults to com.peetrix.fitwayhub)
#   VITE_API_BASE         Capacitor build will pick this up via env
#
# When all six are present, the iOS job produces a real signed .ipa.
# When any is missing, it falls back to an unsigned device .ipa (the
# proper Payload/App.app/ container) suitable for AltStore / Sideloadly /
# Apple Configurator / Xcode "Install from .ipa" re-signing.

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Download project zip
        run: curl -L --fail --retry 3 -o project.zip "${{ inputs.zip_url }}"

      - name: Unzip project
        shell: bash
        run: |
          mkdir -p project
          unzip -q project.zip -d project
          entries=( project/* )
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv project project_outer
            mv "${entries[0]}" project
            rm -rf project_outer
          fi
          if [ ! -f project/package.json ]; then
            echo "::error::package.json not found at project root after unzip"
            ls -la project
            exit 1
          fi

      - name: Detect project type
        id: detect
        shell: bash
        working-directory: project
        run: |
          if ls capacitor.config.* >/dev/null 2>&1; then
            echo "type=capacitor" >> "$GITHUB_OUTPUT"
          elif [ -d android ]; then
            echo "type=native" >> "$GITHUB_OUTPUT"
          elif [ -f app.json ] || [ -f app.config.js ] || [ -f app.config.ts ]; then
            echo "type=expo" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No android/ directory, no Capacitor config, and no Expo config. Cannot build."
            ls -la
            exit 1
          fi
          echo "Detected project type: $(cat "$GITHUB_OUTPUT" | grep ^type=)"

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install npm dependencies
        shell: bash
        working-directory: project
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build web assets (Capacitor)
        if: steps.detect.outputs.type == 'capacitor'
        shell: bash
        working-directory: project
        env:
          CAPACITOR_BUILD: "true"
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script in package.json — skipping web build."
          fi

      - name: Add Android platform if missing (Capacitor)
        if: steps.detect.outputs.type == 'capacitor'
        shell: bash
        working-directory: project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor sync (Android)
        if: steps.detect.outputs.type == 'capacitor'
        shell: bash
        working-directory: project
        run: npx cap sync android

      - name: Expo prebuild (Android)
        if: steps.detect.outputs.type == 'expo'
        working-directory: project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build debug APK
        shell: bash
        working-directory: project/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: project/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS
    runs-on: macos-14
    steps:
      - name: Download project zip
        run: curl -L --fail --retry 3 -o project.zip "${{ inputs.zip_url }}"

      - name: Unzip project
        shell: bash
        run: |
          mkdir -p project
          unzip -q project.zip -d project
          entries=( project/* )
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv project project_outer
            mv "${entries[0]}" project
            rm -rf project_outer
          fi
          if [ ! -f project/package.json ]; then
            echo "::error::package.json not found at project root after unzip"
            ls -la project
            exit 1
          fi

      - name: Detect project type
        id: detect
        shell: bash
        working-directory: project
        run: |
          if ls capacitor.config.* >/dev/null 2>&1; then
            echo "type=capacitor" >> "$GITHUB_OUTPUT"
          elif [ -d ios ]; then
            echo "type=native" >> "$GITHUB_OUTPUT"
          elif [ -f app.json ] || [ -f app.config.js ] || [ -f app.config.ts ]; then
            echo "type=expo" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No ios/ directory, no Capacitor config, and no Expo config. Cannot build."
            ls -la
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install npm dependencies
        shell: bash
        working-directory: project
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build web assets (Capacitor)
        if: steps.detect.outputs.type == 'capacitor'
        shell: bash
        working-directory: project
        env:
          CAPACITOR_BUILD: "true"
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script in package.json — skipping web build."
          fi

      - name: Add iOS platform if missing (Capacitor)
        if: steps.detect.outputs.type == 'capacitor'
        shell: bash
        working-directory: project
        run: |
          if [ ! -d "ios" ]; then
            if ! npm ls @capacitor/ios --depth=0 >/dev/null 2>&1; then
              npm install --no-audit --no-fund @capacitor/ios
            fi
            npx cap add ios
          fi

      - name: Capacitor sync (iOS)
        if: steps.detect.outputs.type == 'capacitor'
        shell: bash
        working-directory: project
        run: |
          set -e
          # If scaffold is incomplete (Podfile missing AND no Package.swift), nuke and regenerate
          if [ ! -f ios/App/Podfile ] && [ ! -f ios/Podfile ] && [ ! -f ios/App/Package.swift ]; then
            rm -rf ios
            if ! npm ls @capacitor/ios --depth=0 >/dev/null 2>&1; then
              npm install --no-audit --no-fund @capacitor/ios
            fi
            npx cap add ios
          fi
          npx cap sync ios

      - name: Expo prebuild (iOS)
        if: steps.detect.outputs.type == 'expo'
        working-directory: project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Locate iOS project dir
        id: iosdir
        shell: bash
        working-directory: project
        run: |
          candidate=""
          for d in ios/App ios; do
            if ls "$d"/*.xcworkspace >/dev/null 2>&1 || ls "$d"/*.xcodeproj >/dev/null 2>&1; then
              candidate="$d"
              break
            fi
          done
          if [ -z "$candidate" ]; then
            echo "::error::Could not find an .xcworkspace or .xcodeproj under ios/ or ios/App/"
            find ios -maxdepth 3 -print 2>/dev/null || true
            exit 1
          fi
          echo "dir=$candidate" >> "$GITHUB_OUTPUT"
          if [ -f "$candidate/Podfile" ]; then
            echo "uses_pods=true" >> "$GITHUB_OUTPUT"
          else
            echo "uses_pods=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Using iOS dir: $candidate"

      - name: Install CocoaPods
        if: steps.iosdir.outputs.uses_pods == 'true'
        shell: bash
        working-directory: project/${{ steps.iosdir.outputs.dir }}
        run: pod install --repo-update

      # ── Decide signed vs unsigned path. Single-line `if` + set +e + explicit
      #    exit 0 so this step can never tank the workflow regardless of which
      #    secrets are or aren't present. (The old version used && with line
      #    continuations and could fail under bash strict mode, producing a
      #    cryptic 0s exit-1 with no real diagnostic.)
      - name: Detect signing configuration
        id: signing
        shell: bash
        env:
          HAS_P12: ${{ secrets.IOS_P12_BASE64 != '' }}
          HAS_PASSWORD: ${{ secrets.IOS_P12_PASSWORD != '' }}
          HAS_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID != '' }}
          HAS_KEY_ID: ${{ secrets.APPSTORE_KEY_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY != '' }}
          HAS_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID != '' }}
        run: |
          set +e
          SIGNED=false
          if [ "$HAS_P12" = "true" ] && [ "$HAS_PASSWORD" = "true" ] && [ "$HAS_ISSUER_ID" = "true" ] && [ "$HAS_KEY_ID" = "true" ] && [ "$HAS_PRIVATE_KEY" = "true" ] && [ "$HAS_TEAM_ID" = "true" ]; then
            SIGNED=true
          fi
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          if [ "$SIGNED" = "true" ]; then
            echo "Signing secrets present — producing a signed .ipa"
          else
            echo "Signing secrets missing — producing an unsigned .ipa for re-signing tools (AltStore/Sideloadly/Xcode)"
          fi
          exit 0

      # ─────────────────────────── SIGNED DEVICE BUILD ─────────────────
      - name: Import code-signing certs
        if: steps.signing.outputs.signed == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Download provisioning profile
        if: steps.signing.outputs.signed == 'true'
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: ${{ secrets.APPSTORE_BUNDLE_ID || 'com.peetrix.fitwayhub' }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Write ExportOptions.plist (signed)
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        working-directory: project/${{ steps.iosdir.outputs.dir }}
        env:
          TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Archive (signed, iphoneos)
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        working-directory: project/${{ steps.iosdir.outputs.dir }}
        env:
          TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          if [ "${{ steps.iosdir.outputs.uses_pods }}" = "true" ]; then
            CONTAINER=$(ls *.xcworkspace | head -n1)
            CONTAINER_FLAG="-workspace"
            SCHEME=$(basename "$CONTAINER" .xcworkspace)
          else
            CONTAINER=$(ls *.xcworkspace 2>/dev/null | head -n1)
            if [ -n "$CONTAINER" ]; then
              CONTAINER_FLAG="-workspace"
              SCHEME=$(basename "$CONTAINER" .xcworkspace)
            else
              CONTAINER=$(ls *.xcodeproj | head -n1)
              CONTAINER_FLAG="-project"
              SCHEME=$(basename "$CONTAINER" .xcodeproj)
            fi
          fi
          echo "Archiving $CONTAINER_FLAG $CONTAINER scheme $SCHEME"
          xcodebuild \
            $CONTAINER_FLAG "$CONTAINER" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: Export signed IPA
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        working-directory: project/${{ steps.iosdir.outputs.dir }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

      - name: Upload signed IPA
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-signed
          path: project/${{ steps.iosdir.outputs.dir }}/build/ipa/*.ipa
          if-no-files-found: error

      # ───────────────────── UNSIGNED FALLBACK ARCHIVE ─────────────────
      # Full CODE_SIGN_* opt-outs so the archive step doesn't trip over
      # missing certs / provisioning profiles on the runner.
      - name: Archive (unsigned)
        if: steps.signing.outputs.signed == 'false'
        shell: bash
        working-directory: project/${{ steps.iosdir.outputs.dir }}
        run: |
          if [ "${{ steps.iosdir.outputs.uses_pods }}" = "true" ]; then
            CONTAINER=$(ls *.xcworkspace | head -n1)
            CONTAINER_FLAG="-workspace"
            SCHEME=$(basename "$CONTAINER" .xcworkspace)
          else
            CONTAINER=$(ls *.xcworkspace 2>/dev/null | head -n1)
            if [ -n "$CONTAINER" ]; then
              CONTAINER_FLAG="-workspace"
              SCHEME=$(basename "$CONTAINER" .xcworkspace)
            else
              CONTAINER=$(ls *.xcodeproj | head -n1)
              CONTAINER_FLAG="-project"
              SCHEME=$(basename "$CONTAINER" .xcodeproj)
            fi
          fi
          xcodebuild \
            $CONTAINER_FLAG "$CONTAINER" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Package unsigned IPA
        if: steps.signing.outputs.signed == 'false'
        shell: bash
        working-directory: project/${{ steps.iosdir.outputs.dir }}
        run: |
          APP_PATH=$(ls -d build/App.xcarchive/Products/Applications/*.app 2>/dev/null | head -n1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::No .app found inside the archive"
            find build/App.xcarchive -maxdepth 4 -print 2>/dev/null || true
            exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa && zip -qr ../App.ipa Payload
          ls -lh ../App.ipa

      - name: Upload unsigned IPA
        if: steps.signing.outputs.signed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: project/${{ steps.iosdir.outputs.dir }}/build/App.ipa
          if-no-files-found: error
