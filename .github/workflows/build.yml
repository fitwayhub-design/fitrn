name: Build mobile apps

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL of the project zip to build"
        required: true
        type: string

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Download project zip
        run: curl -L --fail --retry 3 -o project.zip "${{ inputs.zip_url }}"

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -q project.zip -d project
          # If everything is wrapped in a single top-level folder, descend into it
          entries=( project/* )
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv project project_outer
            mv "project_outer/${entries[0]##*/}" project
            rm -rf project_outer
          fi
          if [ ! -f project/package.json ]; then
            echo "::error::package.json not found at project root after unzip"
            ls -la project
            exit 1
          fi
        shell: bash

      - name: Detect project type
        id: detect
        working-directory: project
        run: |
          if [ -d android ]; then
            echo "type=native" >> "$GITHUB_OUTPUT"
          elif [ -f app.json ] || [ -f app.config.js ] || [ -f app.config.ts ]; then
            echo "type=expo" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No android/ directory and no Expo config (app.json / app.config.{js,ts}). Cannot build."
            ls -la
            exit 1
          fi
        shell: bash

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install npm dependencies
        working-directory: project
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
        shell: bash

      - name: Expo prebuild (Android)
        if: steps.detect.outputs.type == 'expo'
        working-directory: project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build APK
        working-directory: project/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: project/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Download project zip
        run: curl -L --fail --retry 3 -o project.zip "${{ inputs.zip_url }}"

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -q project.zip -d project
          entries=( project/* )
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv project project_outer
            mv "project_outer/${entries[0]##*/}" project
            rm -rf project_outer
          fi
          if [ ! -f project/package.json ]; then
            echo "::error::package.json not found at project root after unzip"
            ls -la project
            exit 1
          fi
        shell: bash

      - name: Detect project type
        id: detect
        working-directory: project
        run: |
          if [ -d ios ]; then
            echo "type=native" >> "$GITHUB_OUTPUT"
          elif [ -f app.json ] || [ -f app.config.js ] || [ -f app.config.ts ]; then
            echo "type=expo" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No ios/ directory and no Expo config (app.json / app.config.{js,ts}). Cannot build."
            ls -la
            exit 1
          fi
        shell: bash

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install npm dependencies
        working-directory: project
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
        shell: bash

      - name: Expo prebuild (iOS)
        if: steps.detect.outputs.type == 'expo'
        working-directory: project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        working-directory: project/ios
        run: pod install --repo-update

      - name: Build archive
        working-directory: project/ios
        run: |
          WORKSPACE=$(ls *.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive
        shell: bash

      - name: Package unsigned IPA
        working-directory: project/ios
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/App.xcarchive/Products/Applications/*.app build/ipa/Payload/
          cd build/ipa && zip -qr ../App.ipa Payload
        shell: bash

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: project/ios/build/App.ipa
          if-no-files-found: error
